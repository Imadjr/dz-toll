<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />


  <!-- Viewport + safe area for iOS notches -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />


  <!-- Light color scheme only, can add dark mode later -->
  <meta name="color-scheme" content="light only" />


  <!-- Theme color for browser UI -->
  <meta name="theme-color" content="#1E3A8A" />


  <!-- SEO Meta Tags - UPDATED for DzToll -->
  <meta name="description" content="DzToll — Seamless automated toll collection, live analytics, and user-friendly balance management." />
  <meta name="keywords" content="toll, dztoll, automated payments, analytics, transportation, highway, RFID" />
  <meta name="author" content="DzToll" />


  <!-- Open Graph - UPDATED for DzToll -->
  <meta property="og:title" content="DzToll - Automated Toll Collection" />
  <meta property="og:description" content="Manage toll operations, analytics, and balances with a modern web app." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="%PUBLIC_URL%/android-chrome-512x512.png" />
  <meta property="og:url" content="https://imadjr.github.io/dz-toll/" />


  <!-- Twitter Card - UPDATED for DzToll -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="DzToll - Automated Toll Collection" />
  <meta name="twitter:description" content="Seamless toll collection and insights for users and admins." />
  <meta name="twitter:image" content="%PUBLIC_URL%/android-chrome-512x512.png" />


  <!-- Icons + PWA - UPDATED for favicon.io -->
  <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/android-chrome-192x192.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
  <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="DzToll" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />


  <!-- Optional Preconnects -->
  <!-- <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /> -->
  <!-- <link rel="preconnect" href="https://fonts.googleapis.com" /> -->
  <!-- <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:400,600,700&display=swap" /> -->


  <title>DzToll - Automated Toll Collection</title>


  <style>
    /* Pre-mount splash + base background */
    :root {
      --brand-50: #f0fdf4;
      --brand-100: #dcfce7;
      --brand-500: #22c55e;
      --brand-600: #16a34a;
      --text-600: #475569;
      --text-900: #0f172a;
    }
    html, body, #root {
      height: 100%;
      margin: 0;
    }
    body {
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(34,197,94,0.12), transparent 60%),
        radial-gradient(900px 500px at 100% 120%, rgba(20,184,166,0.10), transparent 60%),
        linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      color: var(--text-900);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    .splash-wrap {
      display: grid;
      place-items: center;
      height: 100%;
      padding: 24px;
    }
    .splash {
      text-align: center;
    }
    .splash-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: #ffffffcc;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }
    .splash-ping {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(34,197,94,0.15);
      animation: ping 1.6s cubic-bezier(0,0,0.2,1) infinite;
    }
    @keyframes ping {
      0% { transform: scale(1); opacity: 0.7; }
      70% { transform: scale(1.4); opacity: 0; }
      100% { transform: scale(1.4); opacity: 0; }
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--brand-600);
      border-top-color: transparent;
      border-radius: 50%;
      margin: 14px auto 10px;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .splash-title {
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .splash-logo {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }
    .visually-hidden {
      position: absolute !important;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0);
      white-space: nowrap; border: 0;
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-ping { animation: none; }
      .spinner { animation: none; }
    }
  </style>
</head>
<body>
  <noscript>
    <strong>JavaScript is disabled.</strong> Please enable JavaScript to use DzToll.
  </noscript>


  <div id="root">
    <!-- Branded splash while React bundles load -->
    <div class="splash-wrap" role="status" aria-live="polite" aria-label="Loading DzToll application">
      <div class="splash">
        <div class="splash-badge" aria-hidden="true">
          <div class="splash-ping" aria-hidden="true"></div>
          <!-- DzToll Favicon Logo -->
          <img
            src="%PUBLIC_URL%/android-chrome-192x192.png"
            alt="DzToll Logo"
            class="splash-logo"
            onerror="this.style.display='none'"
          />
        </div>
        <div class="spinner" aria-hidden="true"></div>
        <div class="splash-title">Loading DzToll…</div>
        <div style="color: var(--text-600); font-size: 0.9rem;">Automated Toll Collection</div>
        <span class="visually-hidden">DzToll application loading</span>
      </div>
    </div>
  </div>

</body>
</html>
